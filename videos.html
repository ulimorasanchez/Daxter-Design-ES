<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daxter Design — Videos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav-pill">
      <a href="index.html" class="brand">
        <img src="img/daxterlogo.jpg" class="brand-icon" alt="Daxter Design logo">
        <span>Daxter Design</span>
      </a>

      <ul class="nav-links">
        <li><a id="navHome" href="index.html">Home</a></li>
        <li><a id="navVideos" href="videos.html" class="active">Videos</a></li>
        <li><a id="navShop" href="shop.html">Sticker Shop</a></li>
        <li><a id="navAbout" href="about.html">About</a></li>
        <li><a id="navContact" href="contact.html">Contact</a></li>
        <li><a id="navSupport" href="support.html">Support</a></li>
      </ul>

      <!-- Language Toggle -->
      <button id="langToggle" class="btn-lang">
        <img id="langFlag" src="img/flag_es.svg" alt="ES" class="flag-icon">
        ES
      </button>

      <button class="nav-toggle" aria-label="Menu"></button>
    </nav>
  </div>
</header>

<main>

  <!-- PAGE HERO -->
  <section class="page-hero">
    <h1 id="videosTitle">Videos</h1>
    <p id="videosDesc">Watch all animated shorts and character clips.</p>
  </section>

  <!-- VIDEO GRID -->
  <section>
    <div class="container grid-4" id="videoGrid"></div>
  </section>

  <!-- SHORTS SECTION -->
  <section class="page-hero">
    <h1 id="shortsTitle">Shorts</h1>
    <p id="shortsDesc">Short animations and creative projects from Daxter Design.</p>
  </section>

</main>

<footer class="site-footer" id="footer"></footer>

<script src="js/shared.js"></script>
<script src="js/data.js"></script>
<script src="js/lang.js"></script>
<script src="js/main.js"></script>
<script src="js/footer.js"></script>

<script>
  const videoGrid = document.getElementById("videoGrid");

  window.DEFAULT_VIDEOS.forEach(v => {
    videoGrid.innerHTML += `
      <div class="video-card">
        <div class="thumb">
          <img src="${v.thumb}" alt="${v.title}">
        </div>
        <h3>${v.title}</h3>
        <p class="desc">${v.description}</p>
        <a href="${v.url}" target="_blank" class="btn btn-sm btn-primary">Watch</a>
      </div>
    `;
  });
</script>

</body>
</html>
