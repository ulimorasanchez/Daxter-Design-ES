<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daxter Design — Sticker Shop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav-pill">
      <a href="index.html" class="brand">
        <img src="img/daxterlogo.jpg" class="brand-icon" alt="Daxter Design logo">
        <span>Daxter Design</span>
      </a>

      <ul class="nav-links">
        <li><a id="navHome" href="index.html">Home</a></li>
        <li><a id="navVideos" href="videos.html">Videos</a></li>
        <li><a id="navShop" href="shop.html" class="active">Sticker Shop</a></li>
        <li><a id="navAbout" href="about.html">About</a></li>
        <li><a id="navContact" href="contact.html">Contact</a></li>
        <li><a id="navSupport" href="support.html">Support</a></li>
      </ul>

      <!-- Language Toggle -->
      <button id="langToggle" class="btn-lang">
        <img id="langFlag" src="img/flag_es.svg" alt="ES" class="flag-icon">
        ES
      </button>

      <button class="nav-toggle" aria-label="Menu"></button>
    </nav>
  </div>
</header>

<main>

  <!-- PAGE HERO -->
  <section class="page-hero">
    <h1 id="shopTitle">Sticker Shop</h1>
    <p id="shopDesc">Real sticker photos from Daxter Design — each one links directly to Etsy.</p>
  </section>

  <!-- ALL STICKERS -->
  <section>
    <div class="container">
      <div class="section-head">
        <h2 id="shopAll">All Stickers</h2>
      </div>

      <div class="grid-4" id="stickerGrid"></div>
    </div>
  </section>

</main>

<footer class="site-footer" id="footer"></footer>

<script src="js/shared.js"></script>
<script src="js/data.js"></script>
<script src="js/lang.js"></script>
<script src="js/main.js"></script>
<script src="js/footer.js"></script>

<script>
  const stickerGrid = document.getElementById("stickerGrid");

  window.DEFAULT_STICKERS.forEach(s => {
    stickerGrid.innerHTML += `
      <div class="sticker-card shop-card">
        <div class="sticker-thumb">
          <img src="${s.img}" alt="${s.name}">
        </div>
        <h3>${s.name}</h3>
        <div class="row">
          <a href="${s.etsy}" target="_blank" class="btn btn-sm btn-primary">
            View on Etsy
          </a>
        </div>
      </div>
    `;
  });
</script>

</body>
</html>
