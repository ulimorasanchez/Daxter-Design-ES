<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daxter Design — Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav-pill">
      <a href="index.html" class="brand">
        <img src="img/daxterlogo.jpg" class="brand-icon" alt="Daxter Design logo">
        <span>Daxter Design</span>
      </a>

      <ul class="nav-links">
        <li><a id="navHome" href="index.html" class="active">Home</a></li>
        <li><a id="navVideos" href="videos.html">Videos</a></li>
        <li><a id="navShop" href="shop.html">Sticker Shop</a></li>
        <li><a id="navAbout" href="about.html">About</a></li>
        <li><a id="navContact" href="contact.html">Contact</a></li>
        <li><a id="navSupport" href="support.html">Support</a></li>
      </ul>

      <!-- ⭐ Language Toggle with Flag -->
      <button id="langToggle" class="btn-lang">
        <img id="langFlag" src="img/flag_es.svg" alt="ES" class="flag-icon">
        ES
      </button>

      <button class="nav-toggle" aria-label="Menu"></button>
    </nav>
  </div>
</header>


<main>

  <!-- HERO -->
  <section class="hero">
    <div class="container hero-grid">
      <div>
        <h1 id="heroTitle">Art, animation, and stickers from Daxter Design.</h1>
        <p id="heroSub" class="hero-sub">
          Animated stories, character art, and real sticker designs—everything in one place.
        </p>
        <div class="hero-actions">
          <a id="watchVideos" href="videos.html" class="btn btn-primary">Watch videos</a>
          <a id="visitShop" href="shop.html" class="btn btn-ghost">Visit sticker shop</a>
        </div>
      </div>

      <div class="hero-art">
        <img src="img/waving.gif" alt="Ulises photo" class="hero-photo">
      </div>
    </div>
  </section>

  <!-- FEATURED VIDEOS -->
  <section>
    <div class="container">
      <div class="section-head">
        <h2 id="featuredVideos">Featured Videos</h2>
      </div>
      <div id="featuredVideo"></div>
    </div>
  </section>

  <!-- FEATURED STICKERS -->
  <section>
    <div class="container">
      <div class="section-head">
        <h2 id="featuredStickers">Featured Stickers</h2>
      </div>

      <div class="featured-sticker-gallery-wrapper">
        <button id="prevFeaturedSticker" class="btn btn-sm btn-ghost">Prev</button>

        <div id="featuredStickerGallery" class="featured-sticker-gallery">
          <!-- Sticker injected here -->
        </div>

        <button id="nextFeaturedSticker" class="btn btn-sm btn-ghost">Next</button>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer" id="footer"></footer>

<!-- SCRIPTS -->
<script src="js/shared.js"></script>
<script src="js/data.js"></script>
<script src="js/lang.js"></script>
<script src="js/main.js"></script>
<script src="js/footer.js"></script>

<!-- Featured Video Loader -->
<script>
  const featured = window.DEFAULT_VIDEOS.filter(v => v.featured);
  const featuredVideo = document.getElementById("featuredVideo");

  if (featured.length > 0) {
    const v = featured[0];
    featuredVideo.innerHTML = `
      <div class="video-card">
        <div class="thumb">
          <img src="${v.thumb}" alt="${v.title}">
        </div>
        <h3>${v.title}</h3>
        <p class="desc">${v.description}</p>
        <a href="${v.url}" target="_blank" class="btn btn-primary">Watch</a>
      </div>
    `;
  }
</script>

<!-- Featured Sticker Gallery -->
<script>
  const stickerGallery = document.getElementById("featuredStickerGallery");
  const stickers = window.DEFAULT_STICKERS;
  let currentSticker = 0;
  let autoRotate;

  function renderSticker(index) {
    const s = stickers[index];
    stickerGallery.innerHTML = "";

    const img = document.createElement("img");
    img.src = s.img;
    img.alt = s.name;
    img.onclick = () => window.open(s.etsy, "_blank");

    stickerGallery.appendChild(img);
  }

  function nextSticker() {
    currentSticker = (currentSticker + 1) % stickers.length;
    renderSticker(currentSticker);
  }

  function prevSticker() {
    currentSticker = (currentSticker - 1 + stickers.length) % stickers.length;
    renderSticker(currentSticker);
  }

  function startAutoRotate() {
    autoRotate = setInterval(nextSticker, 4000);
  }

  function stopAutoRotate() {
    clearInterval(autoRotate);
  }

  document.getElementById("nextFeaturedSticker").onclick = () => {
    stopAutoRotate();
    nextSticker();
    startAutoRotate();
  };

  document.getElementById("prevFeaturedSticker").onclick = () => {
    stopAutoRotate();
    prevSticker();
    startAutoRotate();
  };

  renderSticker(currentSticker);
  startAutoRotate();
</script>

</body>
</html>
